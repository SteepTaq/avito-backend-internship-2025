version: '3.8'

services:
    postgres:
        image: postgres:16-alpine
        container_name: avito_postgres
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-avito}
        ports:
            - '${POSTGRES_PORT:-5432}:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - avito_network
        restart: unless-stopped

    migrate:
        build:
            context: .
            dockerfile: Dockerfile.migrate
        container_name: avito_migrate
        environment:
            DATABASE_URL: 'postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-avito}?sslmode=disable'
            LOG_LEVEL: ${LOG_LEVEL:-info}
        volumes:
            - ./migrations:/migrations
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - avito_network
        command: -command=up -migrations-path=/migrations -log-level=${LOG_LEVEL:-info}
        restart: 'no'

    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: avito_app
        ports:
            - '${SERVER_PORT:-8080}:${SERVER_PORT:-8080}'
        environment:
            SERVER_PORT: ${SERVER_PORT:-8080}
            DATABASE_URL: 'postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-avito}?sslmode=disable'
            MAX_REVIEWERS: ${MAX_REVIEWERS:-2}
            LOG_LEVEL: ${LOG_LEVEL:-info}
        depends_on:
            migrate:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
        networks:
            - avito_network
        restart: unless-stopped
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'wget --no-verbose --tries=1 --method=GET -O /dev/null http://localhost:$$SERVER_PORT/health || exit 1',
                ]
            interval: 60s
            timeout: 10s
            retries: 3
            start_period: 40s

networks:
    avito_network:
        driver: bridge

volumes:
    postgres_data:
