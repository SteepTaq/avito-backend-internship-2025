run:
    timeout: 5m
    tests: true

linters-settings:
    errcheck:
        check-type-assertions: true
        check-blank: true
    goconst:
        min-len: 2
        min-occurrences: 2
    gocritic:
        enabled-tags:
            - diagnostic
            - experimental
            - opinionated
            - performance
            - style
    gocyclo:
        min-complexity: 15
    maligned:
        suggest-new: true
    misspell:
        locale: US
    nolintlint:
        allow-leading-space: true
        allow-unused: false
        require-explanation: false
        require-specific: false
    gosec:
        severity: medium
        confidence: medium
        excludes:
            - G404

linters:
    enable:
        - errcheck
        - gosimple
        - govet
        - ineffassign
        - staticcheck
        - unused
        - goconst
        - gocritic
        - gofmt
        - goimports
        - misspell
        - revive
        - unconvert
        - unparam
        - gocyclo
        - dupl
        - gosec
        - prealloc
        - typecheck
        - whitespace

issues:
    exclude-dirs:
        - vendor
        - bin
    exclude-files:
        - ".*\\.pb\\.go$"
        - ".*\\.gen\\.go$"
    exclude-rules:
        - path: _test\.go
          linters:
              - errcheck
              - gocyclo
        - path: _test\.go
          linters:
              - dupl
        - path: cmd/
          text: 'exitAfterDefer'
          linters:
              - gocritic
        - path: cmd/migrate/main.go
          text: 'cyclomatic complexity.*of func.*main.*is high'
          linters:
              - gocyclo
        - path: internal/service/service.go
          text: 'cyclomatic complexity.*of func.*ReassignReviewer.*is high'
          linters:
              - gocyclo
    max-issues-per-linter: 0
    max-same-issues: 0
