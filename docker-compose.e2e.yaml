version: '3.8'

services:
    postgres:
        image: postgres:16-alpine
        container_name: avito_e2e_postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: test_db
        ports:
            - '5433:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 2s
            timeout: 3s
            retries: 10
        networks:
            - e2e_network
        restart: unless-stopped

    migrate:
        build:
            context: .
            dockerfile: Dockerfile.migrate
        container_name: avito_e2e_migrate
        environment:
            DATABASE_URL: 'postgres://postgres:postgres@postgres:5432/test_db?sslmode=disable'
            LOG_LEVEL: info
        volumes:
            - ./migrations:/migrations
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - e2e_network
        command: -command=up -migrations-path=/migrations -log-level=info
        restart: 'no'

    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: avito_e2e_app
        ports:
            - '8081:8080'
        environment:
            SERVER_PORT: 8080
            DATABASE_URL: 'postgres://postgres:postgres@postgres:5432/test_db?sslmode=disable'
            MAX_REVIEWERS: 2
            LOG_LEVEL: debug
        depends_on:
            migrate:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
        networks:
            - e2e_network
        restart: unless-stopped
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1',
                ]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 10s

networks:
    e2e_network:
        driver: bridge
